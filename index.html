<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#0b0e12" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildeax · Digital Artist &amp; Developer</title>
    <meta name="description" content="Wildeax is a game designer and UX/UI designer in Medellín, Colombia, who builds the apps he wants to exist." />
    <meta name="author" content="Francol Steven Aristizabal Romero" />
    <link rel="canonical" href="https://www.wildeax.com/" />

    <!-- Link previews. These are static, so every route shares one card. Per-route
         cards would mean injecting tags in worker.ts; not worth it for two routes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wildeax" />
    <meta property="og:url" content="https://www.wildeax.com/" />
    <meta property="og:title" content="Wildeax · Digital Artist &amp; Developer" />
    <meta property="og:description" content="Game design, UX and UI, and apps built to feel right. Medellín, Colombia." />
    <meta property="og:image" content="https://www.wildeax.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Wildeax, digital artist and developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Wildeax_" />
    <meta name="twitter:creator" content="@Wildeax_" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Francol Steven Aristizabal Romero",
        "alternateName": "Wildeax",
        "url": "https://www.wildeax.com/",
        "image": "https://www.wildeax.com/og.jpg",
        "jobTitle": "Game designer and UX/UI designer",
        "worksFor": { "@type": "Organization", "name": "Mood Studios LLC" },
        "address": { "@type": "PostalAddress", "addressLocality": "Medellín", "addressCountry": "CO" },
        "sameAs": [
          "https://github.com/Wildeax",
          "https://x.com/Wildeax_",
          "https://www.instagram.com/wildeaxart/",
          "https://www.linkedin.com/in/wildeax/"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Set dark mode early to avoid FOUC
      try {
        const saved = localStorage.getItem('theme');
        const dark = saved ? saved === 'dark' : true;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root" class="bg-[#0b0e12] text-zinc-200 antialiased selection:bg-brand-500/30 selection:text-white"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
